name: Production release

# Builds the store-uploadable APK signed with the OWNER'S PRIVATE key.
#
# Unlike android-apk.yml (the CI/testing channel, which signs with the
# checked-in public CI key), this workflow:
#   * refuses to run at all when any signing secret is missing — there is no
#     fallback to the public CI key or the debug key;
#   * refuses to run if the configured keystore is the public CI key;
#   * clean-installs and launches the signed APK on an Android emulator before
#     anything is published;
#   * publishes an immutable `store-v<version>` release (APK + ZIP + SHA-256),
#     and never touches the existing `app-v*` releases.
#
# It is manual-only on purpose: a store release happens when the owner decides,
# never as a side effect of a push. See docs/signing-and-migration-plan.md.

on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: "Version this run must build (must match app/pubspec.yaml, e.g. 1.14.0)"
        required: true
        type: string
      publish_release:
        description: "Publish the immutable store-v<version> GitHub release"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: production-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Production-signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Public certificate fingerprint of the CI key
      # (app/android/ci-signing/shia-library-ci.p12). A "production" keystore
      # that matches this is the public key and is rejected.
      CI_KEY_CERT_SHA256: "156AC3030BA5B9A89772BBFC06D59E9D38FB599230093B461130DA3D99AF2D11"
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Verify the requested version matches the source
        run: |
          set -euo pipefail
          actual=$(sed -n 's/^version:[[:space:]]*//p' app/pubspec.yaml | tr -d '\r')
          version=${actual%%+*}
          echo "pubspec: $actual  requested: ${{ inputs.expected_version }}"
          if [[ "$version" != "${{ inputs.expected_version }}" ]]; then
            echo "::error title=Version mismatch::app/pubspec.yaml is $actual but this run asked for ${{ inputs.expected_version }}. Bump pubspec (or fix the input) and run again."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_ENV"
          echo "version_code=${actual##*+}" >> "$GITHUB_ENV"

      # Hard gate, before any work: production signing secrets must be complete.
      # An empty secret becomes an empty string here — that is a failure, not a
      # signal to fall back to the public CI key.
      - name: Require production signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [[ -n "$KEYSTORE_BASE64" ]] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [[ -n "$KEYSTORE_PASSWORD" ]] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [[ -n "$KEY_ALIAS" ]] || missing="$missing ANDROID_KEY_ALIAS"
          [[ -n "$KEY_PASSWORD" ]] || missing="$missing ANDROID_KEY_PASSWORD"
          if [[ -n "$missing" ]]; then
            echo "::error title=Production signing secrets missing::$missing — a store release cannot be built without the owner's private key. Add them under Settings → Secrets and variables → Actions (docs/signing-and-migration-plan.md). This workflow deliberately does not fall back to the public CI key."
            exit 1
          fi
          echo "All four signing secrets are present."

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('app/pubspec.yaml') }}

      - name: Materialise the keystore outside the workspace
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          # $RUNNER_TEMP, not the repository: the key can never land in a
          # build artifact, a git diff, or a log line from inside the tree.
          case "$KEYSTORE_BASE64" in
            *-----BEGIN*) echo "::error title=Keystore secret looks like PEM text::ANDROID_KEYSTORE_BASE64 must be the output of: base64 -w0 your-key.jks"; exit 1;;
          esac
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/owner-release-key.bin"
          chmod 600 "$RUNNER_TEMP/owner-release-key.bin"
          {
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/owner-release-key.bin"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            echo "ANDROID_REQUIRE_PRODUCTION_SIGNING=true"
          } >> "$GITHUB_ENV"

      - name: Refuse the public CI key; record the signer fingerprint
        run: |
          set -euo pipefail
          storetype=JKS
          case "$(tr '[:upper:]' '[:lower:]' <<< "$ANDROID_KEYSTORE_PATH")" in
            *.p12|*.pkcs12) storetype=PKCS12;;
          esac
          listing=$(keytool -list -v -storetype "$storetype" \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" 2>&1) || {
              echo "$listing"
              echo "::error title=Keystore unreadable::keytool could not open the keystore with the configured alias/password. Check the four ANDROID_* secrets."
              exit 1
            }
          fingerprint=$(sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' <<< "$listing" | head -1 | tr -d ':' | tr '[:lower:]' '[:upper:]')
          if [[ -z "$fingerprint" ]]; then
            echo "::error title=No certificate fingerprint::keytool printed no SHA-256 fingerprint."
            exit 1
          fi
          echo "Keystore certificate SHA-256: $fingerprint"
          if [[ "$fingerprint" == "$CI_KEY_CERT_SHA256" ]]; then
            echo "::error title=Public CI key configured as production::The keystore fingerprint matches the checked-in CI key. Generate a NEW private keystore (docs/signing-and-migration-plan.md) — the public key must never sign a store release."
            exit 1
          fi
          echo "keystore_cert_sha256=$fingerprint" >> "$GITHUB_ENV"
          {
            echo "### Production signer"
            echo
            echo "- keystore certificate SHA-256: \`$fingerprint\`"
            echo "- not the public CI key: yes"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Validate corpus against the manifest
        run: python scripts/prepare_databases.py

      - name: Run corpus smoke checks
        run: python scripts/verify_corpus.py

      - name: Replay the client's SQL against the databases
        run: python scripts/verify_client_sql.py

      - name: Run Python tooling tests
        run: python -m unittest discover -v

      - name: Install Dart grammar for the offline client check
        run: python -m pip install --quiet tree-sitter tree-sitter-dart

      - name: Check Flutter client syntax, imports, and removed symbols
        run: python scripts/check_dart.py

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter client
        working-directory: app
        run: flutter analyze --no-pub

      - name: Run Flutter tests
        working-directory: app
        shell: bash
        env:
          SHIAVERSE_PREVIEW_DIR: ${{ github.workspace }}/build/previews
        run: flutter test --reporter expanded

      - name: Build production-signed APK
        working-directory: app
        shell: bash
        env:
          SHIA_DATA_BASE_URL: ${{ vars.SHIA_DATA_BASE_URL }}
        run: |
          set -euo pipefail
          flutter build apk --release --dart-define=SHIA_DATA_BASE_URL="$SHIA_DATA_BASE_URL"
          apk=build/app/outputs/flutter-apk/app-release.apk
          ls -lh "$apk"

      - name: Verify the APK is signed by the production key
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --verbose --print-certs --min-sdk-version 24 "$apk" | tee /tmp/apksigner.log
          digest=$(sed -n 's/^Signer #1 certificate SHA-256 digest:[[:space:]]*//p' /tmp/apksigner.log | head -1 | tr '[:lower:]' '[:upper:]')
          echo "APK signer certificate SHA-256: $digest"
          if [[ "$digest" == "$CI_KEY_CERT_SHA256" ]]; then
            echo "::error title=APK signed with the public CI key::The build is not production-signed. Refusing to publish."
            exit 1
          fi
          if [[ "$digest" != "$keystore_cert_sha256" ]]; then
            echo "::error title=APK signer mismatch::The APK signer ($digest) is not the configured keystore ($keystore_cert_sha256)."
            exit 1
          fi
          echo "APK signer matches the configured production keystore."

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Clean-install and launch the signed APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ github.token }}
          SMOKE_BASELINE_TAG: app-v1.13.1
          SMOKE_BASELINE_ASSET: ShiaVerse-1.13.1.apk
          SHIAVERSE_SMOKE_SHOTS: ${{ github.workspace }}/build/store-shots
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          script: bash scripts/smoke_install_apk.sh

      - name: Package APK, ZIP and SHA-256 manifest
        run: |
          set -euo pipefail
          apk=app/build/app/outputs/flutter-apk/app-release.apk
          base="ShiaVerse-$version"
          mkdir -p build/store-release
          cp "$apk" "build/store-release/$base.apk"
          {
            echo "ShiaVerse $version — production (store) release"
            echo
            echo "Install: extract this ZIP first, then open $base.apk in the phone's Files app."
            echo "This APK is signed with the owner's private production key."
            echo "The exact release APK was clean-installed and launched on an Android 15 emulator before publishing."
            echo "It cannot be installed as an in-place update over a build signed with a different key:"
            echo "back up your data in the old app (Settings → Backup & migrate) first — see docs/signing-and-migration-plan.md."
          } > build/store-release/README.txt
          (cd build/store-release && zip -9 -q "$base.zip" "$base.apk" README.txt)
          unzip -t "build/store-release/$base.zip"
          builtsha=$(sha256sum "$apk" | cut -d' ' -f1)
          unzippedsha=$(unzip -p "build/store-release/$base.zip" "$base.apk" | sha256sum | cut -d' ' -f1)
          if [[ "$builtsha" != "$unzippedsha" ]]; then
            echo "::error title=Zipped APK differs from the tested build::the ZIP would install a different APK"
            exit 1
          fi
          (cd build/store-release && sha256sum "$base.apk" "$base.zip" > SHA256SUMS.txt)
          cat build/store-release/SHA256SUMS.txt
          {
            echo "### Production build"
            echo
            echo "- file: \`$base.apk\` ($(stat -c%s "build/store-release/$base.apk") bytes)"
            echo "- sha-256: \`$builtsha\`"
            echo "- zip: \`$base.zip\` ($(stat -c%s "build/store-release/$base.zip") bytes)"
            echo "- zip sha-256: \`$(sha256sum "build/store-release/$base.zip" | cut -d' ' -f1)\`"
            echo "- APK signer certificate SHA-256: \`$keystore_cert_sha256\`"
            echo "- clean install + launch on Android 15 emulator: passed"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload store artifacts
        uses: actions/upload-artifact@v4
        with:
          name: shiaverse-store-${{ env.version }}
          path: |
            build/store-release/ShiaVerse-${{ env.version }}.apk
            build/store-release/ShiaVerse-${{ env.version }}.zip
            build/store-release/SHA256SUMS.txt
            build/previews/
            build/store-shots/
          if-no-files-found: error
          retention-days: 90

      - name: Publish the immutable store release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="store-v$version"
          base="ShiaVerse-$version"
          # Immutability: a published store release is never overwritten. A new
          # build means a new version — old links and old releases stay valid.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error title=Release already exists::$tag is already published. Store releases are immutable — bump the version and run again. Nothing was overwritten."
            exit 1
          fi
          {
            echo "ShiaVerse $version — production build for app-store submission."
            echo
            echo '```'
            echo "file        : $base.apk"
            echo "size        : $(stat -c%s "build/store-release/$base.apk") bytes"
            echo "sha-256     : $(sha256sum "build/store-release/$base.apk" | cut -d' ' -f1)"
            echo "zip         : $base.zip"
            echo "zip sha-256 : $(sha256sum "build/store-release/$base.zip" | cut -d' ' -f1)"
            echo "signer cert : $keystore_cert_sha256"
            echo '```'
            echo
            echo "Signed with the owner's private production key (not the public CI key)."
            echo "Clean install and launch were verified on an Android 15 emulator before publishing; SHA-256 above is for the exact release bytes."
            echo
            echo "**This APK cannot update an installation signed with the old CI key in place.**"
            echo "Back up in the old build (Settings → بیک اپ و منتقلی) before uninstalling — see docs/signing-and-migration-plan.md."
            echo
            echo "Do not submit to any store without the owner's explicit approval."
          } > build/store-release/notes.md
          gh release create "$tag" \
            "build/store-release/$base.apk" \
            "build/store-release/$base.zip" \
            "build/store-release/SHA256SUMS.txt" \
            --latest=false \
            --title "ShiaVerse $version — production (store) release" \
            --notes-file build/store-release/notes.md \
            --target "$GITHUB_SHA"
          echo "Download: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$base.apk"
          {
            echo "### Download"
            echo
            echo "- APK: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$base.apk"
            echo "- ZIP: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/$base.zip"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/owner-release-key.bin"
