name: Deliver APK

# Fetches an APK already published on an app-v* release and stores its exact
# bytes as unreferenced git blobs. Sandboxed tooling that can only reach
# api.github.com can then download the file through the blobs API.
#
# Trigger: write `tag [asset-name]` into .github/apk-delivery-request and push.
# (workflow_dispatch needs the workflow on the default branch, which this
# working branch must not touch.)
on:
  push:
    branches: ['arena/**']
    paths:
      - .github/workflows/deliver-apk.yml
      - .github/apk-delivery-request

permissions:
  contents: write

jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download the release asset and stage it as git blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          request=$(tr '\n' ' ' < .github/apk-delivery-request)
          # shellcheck disable=SC2086
          set -- $request
          TAG=${1:?request must start with a release tag}
          ASSET=${2:-}
          mkdir -p /tmp/work && cd /tmp/work
          if [ -n "$ASSET" ]; then
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ASSET" --clobber
          else
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.apk' --clobber
          fi
          asset=$(ls -1 | grep -v '^part-' | head -1)
          echo "asset        : $asset"
          echo "size         : $(stat -c%s "$asset") bytes"
          echo "sha256       : $(sha256sum "$asset" | cut -d' ' -f1)"

          parts=""
          split -b 10m -d -a 2 "$asset" part-
          for part in part-??; do
            python3 - "$part" > "$part.json" <<'PY'
          import base64, json, sys
          data = open(sys.argv[1], 'rb').read()
          print(json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}))
          PY
            blob=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$part.json" --jq .sha)
            parts="$parts,$blob"
          done
          manifest_sha=$(sha256sum "$asset" | cut -d' ' -f1)
          manifest_size=$(stat -c%s "$asset")
          manifest_parts=${parts#,}
          echo "::notice title=APK blobs::$asset size=$manifest_size sha256=$manifest_sha parts=$manifest_parts"

          # Also commit the manifest through the contents API so sandboxes that
          # cannot read job logs/annotations can still fetch the blob parts.
          python3 - > /tmp/delivery-manifest.b64 <<PY
          import base64
          text = "asset=$asset\nsize=$manifest_size\nsha256=$manifest_sha\nparts=$manifest_parts\n"
          print(base64.b64encode(text.encode()).decode())
          PY
          content=$(cat /tmp/delivery-manifest.b64)
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/.github/apk-delivery-result?ref=$GITHUB_REF_NAME" --jq .sha 2>/dev/null || true)
          if [ -n "$sha" ]; then
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/.github/apk-delivery-result" \
              -f message="chore(ci): update APK delivery manifest [skip ci]" \
              -f branch="$GITHUB_REF_NAME" -f content="$content" -f sha="$sha" --jq .commit.sha
          else
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/.github/apk-delivery-result" \
              -f message="chore(ci): add APK delivery manifest [skip ci]" \
              -f branch="$GITHUB_REF_NAME" -f content="$content" --jq .commit.sha
          fi
