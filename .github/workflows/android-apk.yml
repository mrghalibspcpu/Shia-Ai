name: Android APK

on:
  push:
    branches: [main, arena/17c56817-shia-ai]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          cache-key: flutter-${{ runner.os }}-${{ hashFiles('app/pubspec.yaml') }}

      - name: Validate source corpus and unpack Android assets
        run: python scripts/prepare_databases.py --output app/assets/databases

      - name: Run backend tests
        run: python -m unittest discover -v

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Analyze Flutter client
        working-directory: app
        shell: bash
        run: |
          set +e
          flutter analyze --no-pub 2>&1 | tee /tmp/flutter-analyze.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            python3 - <<'PY'
          import re
          from pathlib import Path

          for raw in Path('/tmp/flutter-analyze.log').read_text(errors='replace').splitlines():
              parts = raw.strip().split(' • ')
              if len(parts) < 4:
                  continue
              severity = parts[0].split()[0].lower()
              location = parts[-2]
              match = re.fullmatch(r'(.+):(\d+):(\d+)', location)
              if not match:
                  continue
              source, line, column = match.groups()
              message = ' • '.join(parts[1:-2]) + f' ({parts[-1]})'
              message = message.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
              level = 'error' if severity in {'error', 'warning'} else 'warning'
              print(f'::{level} file=app/{source},line={line},col={column},title=Flutter analyzer::{message}')
          PY
            exit "$status"
          fi

      - name: Run Flutter tests
        working-directory: app
        shell: bash
        run: |
          set +e
          flutter test --reporter expanded 2>&1 | tee /tmp/flutter-test.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ $status -ne 0 ]]; then
            python3 - <<'PY'
          from pathlib import Path

          lines = [line for line in Path('/tmp/flutter-test.log').read_text(errors='replace').splitlines() if line.strip()]
          detail = chr(10).join(lines[-60:])[-6000:]
          detail = detail.replace('%', '%25').replace(chr(13), '%0D').replace(chr(10), '%0A')
          print(f'::error title=Flutter tests failed::{detail}')
          PY
            exit "$status"
          fi

      - name: Configure optional production signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" && -n "$KEY_ALIAS" && -n "$KEY_PASSWORD" ]]; then
            KEYSTORE_PATH="$GITHUB_WORKSPACE/app/android/app/owner-release-key.jks"
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            chmod 600 "$KEYSTORE_PATH"
            {
              echo "production=true"
              echo "artifact_name=shia-ai-production-signed-${GITHUB_SHA}"
              echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH"
              echo "ANDROID_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
              echo "ANDROID_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "production=true" >> "$GITHUB_OUTPUT"
            echo "artifact_name=shia-ai-production-signed-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "production=false" >> "$GITHUB_OUTPUT"
            echo "artifact_name=shia-ai-preview-debug-signed-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
            echo "Production signing secrets are incomplete; building with the Android debug key. This APK is for testing only."
          fi

      - name: Build APK
        working-directory: app
        env:
          SHIA_AI_API_BASE_URL: ${{ vars.SHIA_AI_API_BASE_URL }}
        run: flutter build apk --release --dart-define=SHIA_AI_API_BASE_URL="$SHIA_AI_API_BASE_URL"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.signing.outputs.artifact_name }}
          path: app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary signing key
        if: always()
        run: rm -f app/android/app/owner-release-key.jks
