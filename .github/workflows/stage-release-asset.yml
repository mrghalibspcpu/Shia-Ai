name: Stage a release asset as git blobs

# Some build tooling can reach the GitHub API but not the release download
# host (release-assets.githubusercontent.com). This workflow copies one
# already-published asset into unreferenced git blobs and prints their ids,
# so those tools can reassemble the exact bytes.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. app-v1.20.4
        required: true
        type: string
      asset:
        description: Asset file name, e.g. ShiaVerse-1.20.4-arm64-v8a.apk
        required: true
        type: string
      part_mb:
        description: Blob part size in MB
        required: false
        default: "10"
        type: string

permissions:
  contents: write

jobs:
  stage:
    name: Stage asset as blobs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download and stage
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          ASSET: ${{ inputs.asset }}
          PART_MB: ${{ inputs.part_mb }}
        run: |
          set -euo pipefail
          mkdir -p build/stage
          gh release download "$TAG" -p "$ASSET" -D build/stage --clobber
          file="build/stage/$ASSET"
          size=$(stat -c%s "$file")
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          echo "size=$size sha256=$sha"
          split -b "${PART_MB}m" -d -a 2 "$file" build/stage/part-
          parts=""
          for part in build/stage/part-??; do
            python3 - "$part" > "$part.json" <<'PY'
          import base64, json, sys
          data = open(sys.argv[1], 'rb').read()
          print(json.dumps({'content': base64.b64encode(data).decode(), 'encoding': 'base64'}))
          PY
            blob=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/blobs" --input "$part.json" --jq .sha)
            parts="$parts,$blob"
          done
          echo "::notice title=Staged asset::$ASSET size=$size sha256=$sha parts=${parts#,}"
          {
            echo "### Staged asset"
            echo
            echo "- asset: \`$ASSET\`"
            echo "- size: $size bytes"
            echo "- sha-256: \`$sha\`"
            echo "- parts: \`${parts#,}\`"
          } >> "$GITHUB_STEP_SUMMARY"
