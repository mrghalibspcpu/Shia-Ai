name: shia_ai
publish_to: "none"
description: Offline Shia library — Quran, Mafatih al-Jinan, Nahj al-Balagha, and 14 hadith books.
version: 1.3.0+4

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  app_links: ^6.4.1
  crypto: ^3.0.3
  http: ^1.4.0
  path: ^1.9.1
  scrollable_positioned_list: ^0.3.8
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    # SQLite books are optional here: when this folder is empty the app
    # downloads each database on demand (see lib/data_installer.dart).
    - assets/databases/
    - assets/database-manifest.json
    - assets/images/logo.png
    - assets/images/tasneemlogo.png
  fonts:
    - family: JameelNooriNastaleeq
      fonts:
        - asset: assets/fonts/JameelNooriNastaleeq.ttf
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
