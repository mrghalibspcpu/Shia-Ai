plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.shiaai.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "com.shiaai.app"
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    // Production builds must be signed with the owner's private key and must
    // fail loudly when it is missing — a store submission signed with the
    // public CI key (or a throwaway debug key) would be a security incident,
    // not a release. `ANDROID_REQUIRE_PRODUCTION_SIGNING=true` (set by
    // .github/workflows/production-release.yml) turns the fallbacks off; see
    // docs/signing-and-migration-plan.md.
    def requireProductionSigning =
            (System.getenv("ANDROID_REQUIRE_PRODUCTION_SIGNING") ?: "").equalsIgnoreCase("true") ||
            project.hasProperty("requireProductionSigning")
    def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
    def signingStorePassword = System.getenv("ANDROID_KEYSTORE_PASSWORD")
    def signingKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
    def signingKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")

    if (requireProductionSigning) {
        def missing = []
        if (keystorePath == null || keystorePath.isBlank()) missing << "ANDROID_KEYSTORE_PATH"
        if (signingStorePassword == null || signingStorePassword.isBlank()) missing << "ANDROID_KEYSTORE_PASSWORD"
        if (signingKeyAlias == null || signingKeyAlias.isBlank()) missing << "ANDROID_KEY_ALIAS"
        if (signingKeyPassword == null || signingKeyPassword.isBlank()) missing << "ANDROID_KEY_PASSWORD"
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "Production signing required, but signing secrets are missing: " + missing.join(", ") +
                    ". Refusing to fall back to the public CI key or the debug key." +
                    " Configure the four ANDROID_* repository secrets (docs/signing-and-migration-plan.md).")
        }
        if (keystorePath.contains("ci-signing")) {
            throw new GradleException(
                    "Production builds must never be signed with the checked-in CI key" +
                    " (app/android/ci-signing). Point ANDROID_KEYSTORE_PATH at the owner's private keystore.")
        }
    }

    if (keystorePath != null && !keystorePath.isBlank()) {
        // Pick the keystore format from the extension: the repository CI key
        // is PKCS#12, an owner-supplied key is usually a .jks.
        def lowerPath = keystorePath.toLowerCase()
        def keystoreType = (lowerPath.endsWith(".p12") || lowerPath.endsWith(".pkcs12"))
                ? "PKCS12"
                : "JKS"
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storeType keystoreType
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // If release secrets are configured in GitHub, use the owner's key.
            // Otherwise this is a locally installable debug-key-signed release,
            // not an update-compatible Play Store release. Production builds
            // (above) never reach this fallback.
            signingConfig = (keystorePath != null && !keystorePath.isBlank())
                    ? signingConfigs.release
                    : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source "../.."
}
