plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.shiaai.app"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17.toString()
    }

    defaultConfig {
        applicationId "com.shiaai.app"
        minSdk 24
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
    }

    def keystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
    if (keystorePath != null && !keystorePath.isBlank()) {
        // Pick the keystore format from the extension: the repository CI key
        // is PKCS#12, an owner-supplied key is usually a .jks.
        def lowerPath = keystorePath.toLowerCase()
        def keystoreType = (lowerPath.endsWith(".p12") || lowerPath.endsWith(".pkcs12"))
                ? "PKCS12"
                : "JKS"
        signingConfigs {
            release {
                storeFile file(keystorePath)
                storeType keystoreType
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                // Sign with all three schemes. v2 alone is enough for a stock
                // Android 7+ installer, but several vendor ROMs (MIUI/HyperOS
                // in particular) refuse an APK that has no v1 Jar signature,
                // and v3 lets Android rotate/verify keys on Android 9+.
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            // If release secrets are configured in GitHub, use the owner's key.
            // Otherwise this is a locally installable debug-key-signed release,
            // not an update-compatible Play Store release.
            signingConfig = (keystorePath != null && !keystorePath.isBlank())
                    ? signingConfigs.release
                    : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

dependencies {
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
}

flutter {
    source "../.."
}

// Flutter's --split-per-abi build adds ABI*1000 to versionCode (arm64 of
// 1.26.0 was 2036, the universal file stayed 36). Android then refuses the
// next universal or 32-bit APK as a downgrade, and this phone's installer
// reports that as "package appears to be invalid". Every APK of a release
// must carry the same code, and that code must stay above those old offsets.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.versionCode.set(flutter.versionCode.toInteger())
        }
    }
}
afterEvaluate {
    def sharedVersionCode = flutter.versionCode.toInteger()
    android.applicationVariants.configureEach { variant ->
        variant.outputs.configureEach { output ->
            output.versionCodeOverride = sharedVersionCode
        }
    }
}
